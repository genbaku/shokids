<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHOKIDS | Dashboard</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <div class="layout-wrapper">
        <div class="sidebar">
            <div class="logo">SHOKIDS</div>
        </div>

        <div class="main-content">
            <h1 style="font-size: 2.5rem; margin-bottom: 24px; color: var(--brand-blue);">Welcome Back</h1>

            <div class="settings-list">
                <a href="profile.html" class="settings-item">
                    <div class="settings-info">
                        <h4 style="color: var(--brand-blue);">My Profile</h4>
                        <p>View allergies and child settings</p>
                    </div>
                    <span class="arrow">></span>
                </a>

                <a href="menu.html" class="settings-item">
                    <div class="settings-info">
                        <h4 style="color: var(--brand-blue);">Build Order</h4>
                        <p>Browse the menu</p>
                    </div>
                    <span class="arrow">></span>
                </a>

                <a href="tracking.html" class="settings-item">
                    <div class="settings-info">
                        <h4 style="color: var(--brand-blue);">Order History</h4>
                        <p>Track current and past deliveries</p>
                    </div>
                    <span class="arrow">></span>
                </a>
            </div>
        </div>
    </div>

    <div class="bottom-nav">
        <a href="menu.html" class="nav-link">Menu</a>
        <a href="tracking.html" class="nav-link">Tracking</a>
        <a href="dashboard.html" class="nav-link active">Hub</a>
    </div>
</body>

</html>
