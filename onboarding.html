<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>shokids | Profile Setup</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <div class="layout-wrapper">
        <div class="sidebar">
            <div class="logo">SHOKIDS</div>
        </div>

        <div class="main-content">
            <h1 style="font-size: 2.5rem; margin-bottom: 8px; color: var(--brand-blue);">Create Profile</h1>
            <p style="color: var(--text-muted); margin-bottom: 40px;">Personalize your child's menu.</p>

            <form id="onboardingForm">
                <div class="form-section">
                    <h3 style="color: var(--brand-blue);">Age Stage</h3>
                    <div class="grid-select">
                        <label>
                            <input type="radio" name="age" value="baby" required>
                            <div class="card-label">
                                <span>Baby</span>
                                <small>6 - 12 Months</small>
                            </div>
                        </label>
                        <label>
                            <input type="radio" name="age" value="toddler">
                            <div class="card-label">
                                <span>Toddler</span>
                                <small>1 - 3 Years</small>
                            </div>
                        </label>
                        <label>
                            <input type="radio" name="age" value="bigkid">
                            <div class="card-label">
                                <span>Big Kid</span>
                                <small>4 - 7 Years</small>
                            </div>
                        </label>
                    </div>
                </div>

                <div class="form-section">
                    <h3 style="color: var(--brand-blue);">Allergies & Restrictions</h3>
                    <div class="grid-select multi">
                        <label><input type="checkbox" name="allergy" value="dairy">
                            <div class="card-label"><span>Dairy</span></div>
                        </label>
                        <label><input type="checkbox" name="allergy" value="peanut">
                            <div class="card-label"><span>Peanut</span></div>
                        </label>
                        <label><input type="checkbox" name="allergy" value="treenut">
                            <div class="card-label"><span>Tree Nut</span></div>
                        </label>
                        <label><input type="checkbox" name="allergy" value="egg">
                            <div class="card-label"><span>Egg</span></div>
                        </label>
                        <label><input type="checkbox" name="allergy" value="soy">
                            <div class="card-label"><span>Soy</span></div>
                        </label>
                        <label><input type="checkbox" name="allergy" value="wheat">
                            <div class="card-label"><span>Wheat</span></div>
                        </label>
                        <label><input type="checkbox" name="allergy" value="fish">
                            <div class="card-label"><span>Fish</span></div>
                        </label>
                        <label><input type="checkbox" name="allergy" value="sesame">
                            <div class="card-label"><span>Sesame</span></div>
                        </label>
                    </div>
                </div>

                <button type="submit" class="btn btn-pink" style="max-width: 300px;">Build Menu</button>
            </form>
        </div>
    </div>
    <script src="js/onboarding.js"></script>
</body>

</html>
